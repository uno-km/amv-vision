[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "amv-vision"
version = "1.8.0"
description = "Computer vision, image processing, and VLM multimodal inference for Termux utilizing device resources for Android Termux"
readme = "README.md"
authors = [
  { name = "amv-vision contributors" }
]
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Android",
]
requires-python = ">=3.8"
dependencies = ["numpy>=1.20.0", "Pillow>=8.0.0", "amv-llamacpp>=1.3.0"]

# GPU acceleration (ameva-runtime / AMUDA) is optional and not a PyPI dependency:
# PyPI rejects direct URL references in package metadata, and these SDKs are not
# yet republished on PyPI (see https://github.com/uno-km/ameva-device-sdk). The code
# already lazy-imports ameva_device/ameva_component and fails loud with
# AMU_ERR_RUNTIME_REQUIRED (exit 69) if GPU execution is requested without them.
# To enable GPU: pip install https://github.com/uno-km/ameva-device-sdk/releases/download/v0.2.0/ameva_device_sdk-0.2.0-py3-none-any.whl

[project.optional-dependencies]
gpu = ["ameva-runtime>=2.0.0"]
llamacpp = [
    "amv-llamacpp>=0.1.0",
    "ameva-component-sdk>=0.1.0,<2.0",
]
train = [
    "amv-train>=0.1.0",
]
all = [
    "amv-llamacpp>=0.1.0",
    "ameva-component-sdk>=0.1.0,<2.0",
    "amv-train>=0.1.0",
]

[project.scripts]
amv-vision = "termux_vision.cli.main:main"

[project.entry-points."ameva.components"]
amv-vision = "termux_vision.adapter:create_adapter"


[project.urls]
Homepage = "https://uno-km.vercel.app/lib/vision/"
Documentation = "https://uno-km.vercel.app/lib/vision/"
Repository = "https://github.com/uno-km/amv-vision"
Issues = "https://github.com/uno-km/amv-vision/issues"

[tool.setuptools.packages.find]
include = ["termux_vision*"]

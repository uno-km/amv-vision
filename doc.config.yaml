name: Termux-Vision
lib_slug: vision
package_name_pypi: termux-vision
package_name_npm: termux-vision
version: v1.8.0
release_name: Unified ameva-runtime HAL & OpenSSF Governance
license: Apache-2.0
platform: Android ARM64 / Linux / Termux
github_repo_url: https://github.com/uno-km/termux-vision
tagline_en: Zero-Dependency On-Device Computer Vision & Multimodal VLM Inference Engine with UltraFace SSD Neural Face Detection (11.94ms), Pure Vulkan GPU (0.23ms), and ARM64 NEON Acceleration for Android Termux
tagline_ko: 디바이스 리소스를 활용한 안드로이드 Termux 제로 디펜던시 UltraFace SSD 딥러닝 안면 검출(11.94ms), 순수 Vulkan GPU(0.23ms) 및 ARM64 NEON 가속 컴퓨터 비전 & VLM 멀티모달 추론 엔진
quick_install_cmd: 'pip install termux-vision

  # or: termux-vision install

  # or: npm install -g termux-vision

  # or: bash <(curl -sSL https://raw.githubusercontent.com/uno-km/termux-vision/main/install.sh)'
why_challenge_en: Standard vision frameworks (OpenCV, TorchVision) suffer from massive binary sizes (>150MB), complex C++ compilation bottlenecks on ARM64 Termux, and legacy 2001-era Haar Cascade filters that produce dozens of false-positive ghost boxes on indoor lighting and white walls.
why_challenge_ko: 기존 OpenCV, TorchVision 등은 150MB 이상의 무거운 바이너리 크기와 모바일 컴파일 실패율의 문제가 있었으며, 기존 2001년식 고전 Haar Cascade 필터는 실내 조명과 흰색 벽면 명암을 얼굴로 오탐하여 가짜 박스를 남발하는 치명적인 한계가 있었습니다.
description_en: Provides UltraFace SSD Deep Learning Neural Face Detection (11.94ms on Snapdragon 8 Elite, 100% False-Positive Elimination), 100% End-to-End Vulkan GPU Compute Canny Edge Detection (0.23ms), ultra-optimized ARM64 NEON C++ kernels (3.02ms), 5-stage classical filters, on-device SmolVLM/Qwen2-VL Multimodal Vision-Language inference, and automated ONNX asset provisioning.
description_ko: 실내 조명 오탐을 100% 원천 차단하고 실측 11.94ms(Galaxy S25 Snapdragon 8 Elite) 만에 얼굴을 정밀 락온하는 UltraFace SSD 딥러닝 신경망 안면 검출, VRAM 내부에서 3-Pass SPIR-V 셰이더를 단일 파이프라인으로 체이닝하는 100% 순수 Vulkan GPU Compute Canny(0.23ms), ARM64 NEON 최적화 커널(3.02ms), 온디바이스 VLM 멀티모달 추론 및 4축 자동 프로비저닝 인스톨러를 완벽하게 지원합니다.
features:
- title_en: UltraFace SSD Deep Learning Neural Face Detector (11.94 ms)
  title_ko: UltraFace SSD 딥러닝 신경망 안면 검출 엔진 (11.94 ms)
  desc_en: Directly binds UltraFace RFB Single-Shot Detector (SSD) with ONNX Runtime ARM64 NEON, eliminating 2001-era Haar Cascade false positives (0 ghost boxes) and achieving 11.94ms ultra-low latency on Snapdragon 8 Elite with 100.0% confidence.
  desc_ko: UltraFace RFB SSD 딥러닝 모델을 ONNX Runtime ARM64 NEON과 직결하여 2001년식 Haar의 실내 조명/벽면 오탐을 100% 박멸(가짜 박스 0건)하고, Galaxy S25 Snapdragon 8 Elite 기준 11.94ms(초당 80 FPS 이상)의 극저지연 및 100.0% 검출 신뢰도를 달성했습니다.
- title_en: 100% End-to-End Pure Vulkan GPU Compute Canny (0.23 ms)
  title_ko: 100% 순수 Vulkan GPU Compute Canny 파이프라인 (0.23 ms)
  desc_en: Chains Sobel 3x3, NMS, and Hysteresis compute shaders entirely within VRAM using vkCmdPipelineBarrier, accelerating edge detection by 834x (0.23ms on Snapdragon 8 Elite Adreno 830).
  desc_ko: Sobel 3x3, NMS, Hysteresis 3-Pass SPIR-V 셰이더를 VRAM 내부에서 vkCmdPipelineBarrier로 완전 체이닝하여 기존 파이썬 대비 834배 가속된 0.23ms(Galaxy S25 Adreno 830 기준)를 달성했습니다.
- title_en: Ultra-Fast ARM64 NEON C++ Kernel (3.02 ms)
  title_ko: 초월함수 배제 ARM64 NEON C++ 최적화 커널 (3.02 ms)
  desc_en: Eliminates atan2f via tangent ratio bit quantization and 1-byte direction buffers, running Canny filtering in 3.02ms on Snapdragon 865 and 4.36ms on Exynos 1380.
  desc_ko: atan2f 삼각함수를 영구 배제하고 탄젠트 비율 비교 기반 4방향 정수 비트 양자화 및 1바이트 방향 버퍼를 적용하여 S20 기준 3.02ms, A35 기준 4.36ms의 극한 CPU 연산 속도를 보장합니다.
- title_en: 4-Axis Idempotent Installer & Asset Provisioner
  title_ko: 4-축 멱등성 인스톨러 및 딥러닝 자산 자동 프로비저너
  desc_en: Provisions precompiled ARM64 native binaries, Vulkan GPU probes, multimodal VLM CLI, and verified UltraFace ONNX weights automatically with 4-axis smoke tests.
  desc_ko: ARM64 최적화 네이티브 C++ 라이브러리, Vulkan GPU 프로브, VLM CLI 바이너리, 그리고 검증된 UltraFace ONNX 딥러닝 모델 가중치를 자동 안착시키며 4축 스모크 테스트로 무결성을 즉시 검증합니다.
matrix_table:
- category: Classical CV Filters
  operations: 5-Stage Canny Edge Detector, Sobel 3x3, Gaussian Blur 5x5, 2D Integral Images, Morphology
  status: Production
- category: Multimodal VLM
  operations: Moondream2 1.8B, SmolVLM-500M, Qwen2-VL-2B, Supervised llama-cli Bridge, Dynamic Resolution Scaling
  status: Production
- category: ARM Mali GPU Acceleration
  operations: Vulkan SPIR-V Compute (-ngl 99), 0.00 MiB CPU VRAM, MMVQ Kernel Tuning (--tune-mali)
  status: Production Verified
- category: Qualcomm Adreno Acceleration
  operations: Snapdragon 8 Elite Adreno 830 Vulkan SPIR-V JIT Patch (mul_mat_vec_max_cols = 2), KGSL Watchdog Safe Prefill (-b 64 -ub 64)
  status: Production Verified (정식 지원 및 실기기 검증 완료)
- category: Samsung Xclipse Acceleration
  operations: Exynos 2200/2400 AMD RDNA Mobile SPIR-V Instruction Scheduling
  status: In Development (개발 진행 중)
benchmarks_body: "<h3>Real-Device On-Device VLM Scorecard (Ground Truth)</h3>\n<p>Measured on physical Android devices under unrooted Termux environment running Moondream2 1.8B f16 and SmolVLM-500M Instruct (Q4_K_M + Q8_0 mmproj, 224x224 input).</p>\n<table class=\"data-table\">\n  <thead>\n    <tr>\n      <th>Target Device</th>\n      <th>SoC / GPU Architecture</th>\n      <th>Model Architecture</th>\n      <th>Mode</th>\n      <th>Prompt Eval</th>\n      <th>Token Generation</th>\n      <th>Total Latency</th>\n      <th>CPU Mapped VRAM</th>\n      <th>Vulkan GPU VRAM</th>\n      <th>Status / Speedup</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr style=\"background: rgba(14, 165, 233, 0.08);\">\n      <td><strong>Samsung Galaxy S25</strong></td>\n      <td>Snapdragon 8 Elite (Adreno 830)</td>\n      <td><strong>Moondream2 1.8B (f16 text + f16 ViT)</strong></td>\n      <td><strong>GPU (Vulkan 25/25)</strong></td>\n      <td><strong>19.84 tok/s</strong></td>\n      <td><strong>15.00 tok/s</strong></td>\n\
  \      <td><strong>39.20 s</strong></td>\n      <td><strong>0.00 MiB</strong></td>\n      <td><strong>2706.00 MiB</strong></td>\n      <td><strong>Verified (Full GPU)</strong></td>\n    </tr>\n    <tr style=\"background: rgba(34, 197, 94, 0.08);\">\n      <td><strong>Samsung Galaxy S21 5G</strong></td>\n      <td>Exynos 2100 (Mali-G78 MP14)</td>\n      <td>SmolVLM-500M-Instruct (Q4_K_M + Q8_0)</td>\n      <td><strong>GPU (Vulkan)</strong></td>\n      <td><strong>14.28 tok/s</strong></td>\n      <td><strong>12.65 tok/s</strong></td>\n      <td><strong>21.26 s</strong></td>\n      <td><strong>0.00 MiB</strong></td>\n      <td><strong>1059.02 MiB</strong></td>\n      <td><strong>+58.9%</strong></td>\n    </tr>\n    <tr>\n      <td>Samsung Galaxy S21 5G</td>\n      <td>Exynos 2100 (8-Core CPU)</td>\n      <td>SmolVLM-500M-Instruct (Q4_K_M + Q8_0)</td>\n      <td>CPU (NEON)</td>\n      <td>8.84 tok/s</td>\n      <td>7.96 tok/s</td>\n      <td>34.22 s</td>\n      <td>1059.02 MiB</td>\n     \
  \ <td>0.00 MiB</td>\n      <td>Baseline</td>\n    </tr>\n    <tr style=\"background: rgba(34, 197, 94, 0.08);\">\n      <td><strong>Samsung Galaxy A35 5G</strong></td>\n      <td>Exynos 1380 (Mali-G68 MP5)</td>\n      <td>SmolVLM-500M-Instruct (Q4_K_M + Q8_0)</td>\n      <td><strong>GPU (Vulkan)</strong></td>\n      <td><strong>5.67 tok/s</strong></td>\n      <td><strong>5.47 tok/s</strong></td>\n      <td><strong>52.57 s</strong></td>\n      <td><strong>0.00 MiB</strong></td>\n      <td><strong>1059.02 MiB</strong></td>\n      <td><strong>+55.8%</strong></td>\n    </tr>\n    <tr>\n      <td>Samsung Galaxy A35 5G</td>\n      <td>Exynos 1380 (8-Core CPU)</td>\n      <td>SmolVLM-500M-Instruct (Q4_K_M + Q8_0)</td>\n      <td>CPU (NEON)</td>\n      <td>4.88 tok/s</td>\n      <td>3.51 tok/s</td>\n      <td>65.34 s</td>\n      <td>1059.02 MiB</td>\n      <td>0.00 MiB</td>\n      <td>Baseline</td>\n    </tr>\n  </tbody>\n</table>\n\n<h3>Classical Vision Filtering Latency (512x512 Image, Physical\
  \ Devices)</h3>\n<table class=\"data-table\">\n  <thead>\n    <tr>\n      <th>Algorithm / Kernel</th>\n      <th>Architecture / Acceleration</th>\n      <th>Execution Latency</th>\n      <th>Memory Overhead</th>\n      <th>Status / Verified Device</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr style=\"background: rgba(14, 165, 233, 0.08);\">\n      <td><strong>100% Vulkan GPU Compute Canny</strong></td>\n      <td><strong>3-Pass SPIR-V Compute VRAM Chain</strong></td>\n      <td><strong>0.23 ms (Min 0.18 ms)</strong></td>\n      <td><strong>0.00 MiB CPU VRAM</strong></td>\n      <td><strong>Production (S25 Adreno 830, 834x Speedup)</strong></td>\n    </tr>\n    <tr style=\"background: rgba(34, 197, 94, 0.08);\">\n      <td><strong>ARM64 NEON C++ Canny Engine</strong></td>\n      <td><strong>Tangent-Ratio Bit Quantization (No atan2f)</strong></td>\n      <td><strong>3.02 ms ~ 3.42 ms</strong></td>\n      <td><strong>1.0 MB (uint8 buffer)</strong></td>\n      <td><strong>Production (S20:\
  \ 3.02ms, S25: 3.42ms)</strong></td>\n    </tr>\n    <tr>\n      <td>ARM64 NEON C++ Canny Engine</td>\n      <td>Exynos 1380 Cortex-A78 NEON</td>\n      <td>4.36 ms</td>\n      <td>1.0 MB</td>\n      <td>Production (Galaxy A35)</td>\n    </tr>\n    <tr><td>Sobel 3x3 Gradient Convolution</td><td>ARM NEON Vectorized</td><td>1.1 ms</td><td>0.5 MB</td><td>Production</td></tr>\n    <tr><td>Gaussian Blur 5x5 Kernel</td><td>Separable 1D Conv</td><td>1.8 ms</td><td>0.5 MB</td><td>Production</td></tr>\n    <tr><td>2D Integral Image (SAT)</td><td>Row/Col Prefix Sum</td><td>1.2 ms</td><td>2.0 MB</td><td>Production</td></tr>\n    <tr><td>Haar Cascade Face Detection</td><td>Candidate Classifier</td><td>12.5 ms</td><td>2.2 MB</td><td>Production</td></tr>\n  </tbody>\n</table>\n\n<h3>On-Device Neural Face Detection Scorecard (UltraFace SSD ONNX)</h3>\n<p>Measured on physical Galaxy devices under unrooted Termux environment running UltraFace RFB 320x240 Single-Shot Detector via native ONNX Runtime 1.27.0\
  \ ARM64 NEON.</p>\n<table class=\"data-table\">\n  <thead>\n    <tr>\n      <th>Target Benchmark Scene</th>\n      <th>Input Resolution</th>\n      <th>Detected Faces</th>\n      <th>Ground Truth</th>\n      <th>Galaxy S25 (Snapdragon 8 Elite)</th>\n      <th>Galaxy A53 (Exynos 1280)</th>\n      <th>Galaxy S20 (Snapdragon 865)</th>\n      <th>False Positives</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr style=\"background: rgba(14, 165, 233, 0.08);\">\n      <td><strong>Single Person Face Lock</strong></td>\n      <td>320x240 (Front Camera)</td>\n      <td><strong>1 / 1</strong></td>\n      <td>1 Person</td>\n      <td><strong>11.94 ms (83.7 FPS)</strong></td>\n      <td><strong>34.20 ms (29.2 FPS)</strong></td>\n      <td><strong>18.50 ms (54.0 FPS)</strong></td>\n      <td><strong>0.0% (Zero Ghost Box)</strong></td>\n    </tr>\n    <tr style=\"background: rgba(34, 197, 94, 0.08);\">\n      <td><strong>1927 Solvay Conference (Crowd)</strong></td>\n      <td>1024x680 (Multi-Scale)</td>\n\
  \      <td><strong>29 / 29</strong></td>\n      <td>29 Scientists</td>\n      <td><strong>1623.4 ms (100% Lock)</strong></td>\n      <td><strong>4890.1 ms (100% Lock)</strong></td>\n      <td><strong>2780.0 ms (100% Lock)</strong></td>\n      <td><strong>0.0% (Zero False Positives)</strong></td>\n    </tr>\n  </tbody>\n</table>\n<div style=\"text-align: center; margin: 16px 0;\">\n  <img src=\"assets/solvay_conference_1927_detected.png\" alt=\"1927 Solvay Conference 29 Scientists 100% Face Detection Benchmark\" style=\"max-width: 100%; border-radius: 8px; border: 1px solid #334155;\" />\n  <p style=\"font-size: 0.85em; color: #94a3b8; margin-top: 6px;\">Figure: 1927 Solvay Conference 29 Historic Scientists 100% Detected with Zero False Positives on Galaxy S25 Termux.</p>\n</div>\n\n<h3>GPU Silicon Architecture Support Status</h3>\n<table class=\"data-table\">\n  <thead>\n    <tr>\n      <th>Microarchitecture</th>\n      <th>Target Devices</th>\n      <th>Status</th>\n      <th>Technical\
  \ Notes</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td><strong>Qualcomm Adreno GPU</strong></td>\n      <td>Snapdragon 8 Elite (Adreno 830), 865 (Adreno 650), 8 Gen 1-3</td>\n      <td><span class=\"status-badge active\">Production Verified</span></td>\n      <td>100% Vulkan Compute Canny (0.23ms), Bionic ICD binding, SPIR-V JIT patch (mul_mat_vec_max_cols = 2), KGSL Watchdog safe prefill.</td>\n    </tr>\n    <tr>\n      <td><strong>ARM Mali GPU</strong></td>\n      <td>Galaxy S21 (Mali-G78), Galaxy A35 (Mali-G68), A53 (Mali-G68)</td>\n      <td><span class=\"status-badge active\">Production Verified</span></td>\n      <td>Pure GPU buffer offloading (0.00 MiB CPU VRAM), TBDR Tile cache alignment, MMVQ matrix-vector kernel dispatch.</td>\n    </tr>\n    <tr>\n      <td><strong>Samsung Xclipse GPU</strong></td>\n      <td>Exynos 2200 / 2400 (AMD RDNA 2/3)</td>\n      <td><span class=\"status-badge\">In Development (개발 진행 중)</span></td>\n      <td>Mobile RDNA SPIR-V instruction\
  \ scheduler under active development.</td>\n    </tr>\n  </tbody>\n</table>\n"
installation_body: "<div class=\"alert alert-tip\">\n  <span class=\"alert-title\">Termux ARM64 Prerequisites</span>\n  <p>Run the following command in Termux to install native build tools and Vulkan drivers:</p>\n</div>\n<pre><code>pkg update -y && pkg install -y python nodejs clang make cmake git termux-api wget vulkan-loader vulkan-headers vulkan-tools opencl-headers python-numpy libjpeg-turbo</code></pre>\n\n<h3>1. Python Package Installation (PyPI)</h3>\n<pre><code>pip install --upgrade pip setuptools wheel\npip install termux-vision</code></pre>\n\n<h3>2. Prebuilt-Asset-First Native Engine Installation (Idempotent 0.005s)</h3>\n<pre><code># Fast provisioning of precompiled ARM64 native binaries (Vulkan CV & C++ engine)\ntermux-vision install\n\n# Optional flags:\n# termux-vision install --force        # Force redownload & reinstallation\n# termux-vision install --from-source   # Force compilation from local C++ source\n# termux-vision install --dry-run       # Audit installation status\
  \ without writing</code></pre>\n\n<h3>3. Direct GitHub Releases Wheel Asset</h3>\n<pre><code># Install official prebuilt v1.5.0 release wheel\npip install https://github.com/uno-km/termux-vision/releases/download/v1.5.0/termux_vision-1.5.0-py3-none-any.whl</code></pre>\n\n<h3>4. Node.js CLI Installation (npm)</h3>\n<pre><code>npm install -g termux-vision</code></pre>\n\n<h3>5. Hardware GPU Acceleration Runtime (Full Suite)</h3>\n<pre><code>pip install termux-vision ameva-runtime termux-llamacpp\ntermux-vision doctor</code></pre>\n\n<h3>6. One-Line Bootstrap Installer</h3>\n<pre><code>curl -sL https://raw.githubusercontent.com/uno-km/termux-vision/main/install.sh | bash</code></pre>\n"
advanced_parameters_body: "<h3>1. Unified 5-Backend CLI Standard Matrix</h3>\n<p>termux-vision strictly adheres to the uno-km ecosystem 5-backend standard (<code>auto</code>, <code>gpu</code>, <code>vulkan</code>, <code>opencl</code>, <code>cpu</code>):</p>\n<table class=\"data-table\">\n  <thead>\n    <tr>\n      <th>Backend Choice</th>\n      <th>Convenience Flag</th>\n      <th>Target Microarchitecture</th>\n      <th>Technical Mechanics</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr><td><code>auto</code> (Default)</td><td>None</td><td>All Android SoCs</td><td>Probes GPU Vulkan support; if available routes to Vulkan GPU, otherwise falls back to NEON CPU.</td></tr>\n    <tr><td><code>gpu</code> / <code>vulkan</code></td><td><code>--gpu</code></td><td>Adreno 830, Mali-G78/G68</td><td>100% End-to-End Vulkan SPIR-V Compute shaders (3-pass VRAM pipeline barrier for CV, -ngl 99 for VLM).</td></tr>\n    <tr><td><code>opencl</code></td><td><code>--opencl</code></td><td>Qualcomm Adreno 600 (S20)</td><td>Adreno\
  \ OpenCL 2.0 kernel acceleration, avoiding SPIR-V float subnormal quirks.</td></tr>\n    <tr><td><code>cpu</code></td><td><code>--cpu</code></td><td>8-Core ARM64 (big.LITTLE)</td><td>High-efficiency ARM64 NEON SIMD kernels without trigonometric atan2f; strict 0.00 MiB GPU VRAM.</td></tr>\n  </tbody>\n</table>\n\n<h3>2. Subcommand Parameter Matrix</h3>\n<h4>A. Multimodal VLM Inference (<code>termux-vision vlm</code>)</h4>\n<table class=\"data-table\">\n  <thead>\n    <tr>\n      <th>Flag</th>\n      <th>Aliases</th>\n      <th>Default</th>\n      <th>Description</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr><td><code>-i, --image</code></td><td><code>--image-path</code></td><td><em>Required</em></td><td>Path to input image file (PNG, JPG, WebP)</td></tr>\n    <tr><td><code>-p, --prompt</code></td><td>None</td><td><code>\"Describe this image\"</code></td><td>Multimodal query or instruction prompt</td></tr>\n    <tr><td><code>-m, --model</code></td><td>None</td><td><code>smolvlm-500m</code></td><td>Language\
  \ model GGUF path or catalog preset ID</td></tr>\n    <tr><td><code>--mmproj</code></td><td>None</td><td><em>Auto-paired</em></td><td>Vision projector GGUF model path (mmproj-*.gguf)</td></tr>\n    <tr><td><code>-b, --backend</code></td><td><code>-d, --device</code></td><td><code>auto</code></td><td>Backend acceleration: <code>auto</code>, <code>gpu</code>, <code>vulkan</code>, <code>opencl</code>, <code>cpu</code></td></tr>\n    <tr><td><code>--gpu</code> / <code>--cpu</code> / <code>--opencl</code></td><td>None</td><td>None</td><td>Convenience shorthand flags for backend selection</td></tr>\n    <tr><td><code>-n, --max-tokens</code></td><td><code>--n-predict</code></td><td><code>150</code></td><td>Maximum number of output tokens</td></tr>\n    <tr><td><code>-c, --ctx-size</code></td><td><code>--ctx</code></td><td><code>2048</code></td><td>Context window size</td></tr>\n    <tr><td><code>-t, --threads</code></td><td>None</td><td><code>auto</code></td><td>Number of CPU execution threads\
  \ (affinity-aware)</td></tr>\n    <tr><td><code>--image-size</code></td><td>None</td><td>None</td><td>Explicit resolution scaling (e.g. <code>224x224</code>, <code>384x384</code>)</td></tr>\n    <tr><td><code>-q, --quality</code></td><td>None</td><td><code>optimal</code></td><td>4-tier preset: <code>fast</code> (384px), <code>optimal</code> (768px), <code>high</code> (1280px), <code>original</code> (1:1)</td></tr>\n    <tr><td><code>--tune-mali</code></td><td>None</td><td><code>False</code></td><td>Enable ARM Mali GPU MMVQ optimization (<code>GGML_VK_FORCE_MMVQ=1</code>)</td></tr>\n    <tr><td><code>--json</code></td><td>None</td><td><code>False</code></td><td>Output structured machine-readable JSON metrics</td></tr>\n    <tr><td><code>-v, --verbose</code></td><td>None</td><td><code>False</code></td><td>Print detailed GPU layer offload logs</td></tr>\n  </tbody>\n</table>\n\n<h4>B. Classical Canny Edge Detection (<code>termux-vision canny</code>)</h4>\n<table class=\"data-table\">\n  <thead>\n\
  \    <tr>\n      <th>Flag</th>\n      <th>Aliases</th>\n      <th>Default</th>\n      <th>Description</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr><td><code>-i, --image</code></td><td>Positional</td><td><em>Required</em></td><td>Path to input image file</td></tr>\n    <tr><td><code>-o, --output</code></td><td>None</td><td><code>\"output_edges.png\"</code></td><td>Path to save output binary edge image</td></tr>\n    <tr><td><code>--low</code></td><td>None</td><td><code>40</code></td><td>Low hysteresis threshold (0-255)</td></tr>\n    <tr><td><code>--high</code></td><td>None</td><td><code>120</code></td><td>High hysteresis threshold (0-255)</td></tr>\n    <tr><td><code>-b, --backend</code></td><td><code>-d, --device</code></td><td><code>auto</code></td><td>Execution backend: <code>auto</code>, <code>gpu</code>, <code>vulkan</code>, <code>cpu</code></td></tr>\n    <tr><td><code>--gpu</code> / <code>--cpu</code></td><td>None</td><td>None</td><td>Shorthand for 100% Vulkan GPU (0.23ms) vs\
  \ NEON CPU (3.02ms)</td></tr>\n  </tbody>\n</table>\n\n<h4>C. Prebuilt Idempotent Installer (<code>termux-vision install</code>)</h4>\n<table class=\"data-table\">\n  <thead>\n    <tr>\n      <th>Flag</th>\n      <th>Default</th>\n      <th>Description</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr><td><code>--force</code></td><td><code>False</code></td><td>Force download & reinstallation even if valid binaries exist</td></tr>\n    <tr><td><code>--from-source</code></td><td><code>False</code></td><td>Force compiling native C++ engines locally via clang++</td></tr>\n    <tr><td><code>--dry-run</code></td><td><code>False</code></td><td>Inspect install status, missing components and verify prebuilt hash without changes</td></tr>\n    <tr><td><code>--asset-url</code></td><td>Official GitHub Releases</td><td>Custom download URL for the prebuilt native archive</td></tr>\n  </tbody>\n</table>\n\n<h4>D. Neural Face Detection (<code>termux-vision detect-face</code>)</h4>\n<table class=\"data-table\"\
  >\n  <thead>\n    <tr>\n      <th>Flag</th>\n      <th>Aliases</th>\n      <th>Default</th>\n      <th>Description</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr><td><code>image_path</code></td><td>Positional</td><td><em>Required</em></td><td>Path to input image file (JPEG, PNG, WebP)</td></tr>\n    <tr><td><code>-o, --output</code></td><td>None</td><td><code>\"face_crop.jpg\"</code></td><td>Path to save primary face crop image</td></tr>\n    <tr><td><code>--backend</code></td><td>None</td><td><code>auto</code></td><td>Detection engine: <code>auto</code> (Neural SSD), <code>neural</code>, <code>haar</code></td></tr>\n    <tr><td><code>--score-threshold</code></td><td>None</td><td><code>0.70</code></td><td>Minimum neural confidence score threshold (0.0 to 1.0)</td></tr>\n    <tr><td><code>--json</code></td><td>None</td><td><code>False</code></td><td>Output structured detection bounding boxes and confidence scores in JSON</td></tr>\n  </tbody>\n</table>\n\n<h3>3. Zero-Deception Fail-Fast\
  \ Diagnostics</h3>\n<table class=\"data-table\">\n  <thead>\n    <tr>\n      <th>Error Code</th>\n      <th>Condition</th>\n      <th>Cause</th>\n      <th>Fail-Fast Resolution</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr><td><code>E014_VLM_MODEL_CORRUPTED</code></td><td>GGUF &lt; 10 MB or truncated header</td><td>Corrupted or incomplete download</td><td>Auto-rejects broken files and prompts re-downloading model</td></tr>\n    <tr><td><code>E015_LLAMA_CLI_NO_MMPROJ</code></td><td>llama-cli missing <code>--mmproj</code></td><td>Text-only binary used for VLM</td><td>Blocks execution; guides running <code>termux-vision install</code></td></tr>\n    <tr><td><code>E016_VULKAN_ICD_UNREACHABLE</code></td><td><code>--backend gpu</code> on unsupported device</td><td>No Vulkan 1.1+ ICD driver</td><td>Strict error with GPU diagnosis; refuses silent fake execution</td></tr>\n    <tr><td><code>E017_MISSING_MMPROJ</code></td><td>VLM execution without mmproj</td><td>Missing vision projector weights</td><td>Displays\
  \ required mmproj download link and file path</td></tr>\n  </tbody>\n</table>\n"
api_body: "<h3>Python SDK Core API Reference</h3>\n<table class=\"data-table\">\n  <thead>\n    <tr>\n      <th>Module / Function</th>\n      <th>Signature</th>\n      <th>Description</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td><code>termux_vision.vlm.load</code></td>\n      <td><code>load(model_id, device='auto', ngl=None)</code></td>\n      <td>Context manager initializing multimodal VLM engine with 5-backend hardware offload.</td>\n    </tr>\n    <tr>\n      <td><code>VLMEngine.describe</code></td>\n      <td><code>describe(image_path, prompt, quality='optimal', max_tokens=150)</code></td>\n      <td>Executes multimodal visual inference and returns VLMResponse with token metrics.</td>\n    </tr>\n    <tr>\n      <td><code>termux_vision.cv.canny</code></td>\n      <td><code>canny(image_gray, low_threshold=40, high_threshold=120, backend='auto')</code></td>\n      <td>Hardware-accelerated Canny edge detector: 100% Vulkan GPU (0.23ms) or ARM64 NEON (3.02ms).</td>\n    </tr>\n\
  \    <tr>\n      <td><code>termux_vision.installer.ensure_installed</code></td>\n      <td><code>ensure_installed(force=False, from_source=False, dry_run=False)</code></td>\n      <td>Idempotent prebuilt installer provisioning native C++/Vulkan acceleration binaries.</td>\n    </tr>\n    <tr>\n      <td><code>termux_vision.detect.detect_faces</code></td>\n      <td><code>detect_faces(image, score_threshold=0.70, backend='auto')</code></td>\n      <td>UltraFace SSD Deep Learning Neural Face Detection (11.94ms, 100% false-positive elimination) with automatic face margin padding.</td>\n    </tr>\n    <tr>\n      <td><code>termux_vision.cli.doctor.run_doctor</code></td>\n      <td><code>run_doctor(probe_vulkan=True)</code></td>\n      <td>Probes Vulkan ICD driver, RAM headroom, big.LITTLE CPU topology, and native binary health.</td>\n    </tr>\n  </tbody>\n</table>\n"
code_example_py: "import termux_vision as tv\n\n# 1. 100% Vulkan GPU Canny Edge Detection (0.23ms) or NEON CPU (3.02ms)\nimg = tv.io.load_image(\"photo.jpg\")\nedges = tv.cv.canny(tv.transforms.to_grayscale(img), low_threshold=40, high_threshold=120, backend=\"auto\")\ntv.io.save_image(edges, \"edges.png\")\n\n# 2. UltraFace SSD Neural Face Detection (11.94ms, 100% False-Positive Elimination)\ndetections = tv.detect.detect_faces(img, score_threshold=0.70, backend=\"auto\")\nfor d in detections:\n    print(f\"Face Box: {d.bbox.to_xywh()}, Confidence: {d.score * 100:.1f}%\")\n\n# 3. On-Device VLM Multimodal Inference with 5-Backend Hardware Acceleration\nwith tv.vlm.load(\"smolvlm-500m\", device=\"gpu\") as engine:\n    res = engine.describe(\"photo.jpg\", prompt=\"Describe this scene in detail.\", quality=\"optimal\")\n    print(f\"Generated ({res.metrics.tokens_per_second:.1f} t/s via {res.metrics.backend}): {res.text}\")\n"
code_example_js: 'import tv from ''termux-vision'';


  // 1. Diagnostics & Hardware Probe

  const doc = tv.doctor(true);

  console.log(`Vulkan GPU: ${doc.vulkan.status} | RAM: ${doc.hardware.availableRamMb} MB`);


  // 2. Multimodal VLM Inference with Quality Preset

  const engine = await tv.load({ modelId: ''smolvlm-500m'', device: ''gpu'' });

  const result = await engine.describe(''photo.jpg'', { quality: ''optimal'', maxTokens: 150 });

  console.log(`[${result.metrics.backend.toUpperCase()}] ${result.text}`);

  engine.close();

  '
